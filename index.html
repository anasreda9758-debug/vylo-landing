<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYLO — Study Smarter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #172554 0%, #090f1d 45%, #050810 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 850px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 6px;
      margin-bottom: 28px;
      color: #7aa7ff;
    }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      margin-bottom: 18px;
      line-height: 1.1;
    }

    .subtitle {
      color: #aebbd0;
      font-size: 20px;
      line-height: 1.7;
      max-width: 650px;
      margin: 0 auto 34px;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #334a70;
      border-radius: 999px;
      color: #8bb4ff;
      background: rgba(50, 90, 160, 0.12);
      margin-bottom: 28px;
    }

    .contact {
      margin-top: 44px;
      color: #8290a5;
      font-size: 15px;
    }

    .contact a {
      color: #8bb4ff;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">VYLO</div>

    <div class="badge">
      Educational Platform
    </div>

    <h1>
      Study smarter.<br>
      Achieve more.
    </h1>

    <p class="subtitle">
      VYLO is a modern learning platform designed to help students
      understand, practise, revise and prepare for exams more effectively.
    </p>

    <p class="subtitle">
      We're currently preparing VYLO for launch.
    </p>

    <div class="contact">
      Contact:
      <a href="mailto:support@vylo.win">
        support@vylo.win
      </a>
    </div>

  </main>
</body>
</html>
